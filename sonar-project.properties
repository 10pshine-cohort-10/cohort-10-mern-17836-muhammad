sonar.projectKey=Noted-Fullstack-App
sonar.projectName=Noted Full-Stack Notes Application
sonar.projectVersion=1.0.0

sonar.host.url=http://localhost:9000

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__
sonar.test.inclusions=backend/tests/**/*.test.ts,frontend/src/__tests__/**/*.test.ts,frontend/src/__tests__/**/*.test.tsx

sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/dist/**,**/*.test.ts,**/*.test.tsx
sonar.coverage.exclusions=**/node_modules/**,**/tests/**,**/__tests__/**,backend/src/server.ts,frontend/src/index.tsx

sonar.typescript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
