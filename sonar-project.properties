sonar.projectKey=Noted-Fullstack-App
sonar.projectName=Noted Full-Stack Notes Application
sonar.projectVersion=1.0.0

sonar.host.url=http://localhost:9000

sonar.sources=backend/src,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__
sonar.test.inclusions=backend/tests/**/*.test.js,frontend/src/__tests__/**/*.test.jsx

sonar.exclusions=**/node_modules/**,**/coverage/**,**/build/**,**/dist/**,**/*.test.js,**/*.test.jsx
sonar.coverage.exclusions=**/node_modules/**,**/tests/**,**/__tests__/**,backend/src/server.js,frontend/src/index.js

sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info,frontend/coverage/lcov.info
sonar.sourceEncoding=UTF-8
